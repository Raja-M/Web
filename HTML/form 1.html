<!DOCTYPE html>
<html>
<body>

<h2>Account Login</h2>

<form>
  <label for="username">Username:</label><br>
  <input type="text" id="username" name="username" placeholder="Enter username"><br><br>
  
  <label for="pwd">Password:</label><br>
  <input type="password" id="pwd" name="pwd"><br><br>
  
  <input type="submit" value="Login">
</form>

<p>The <b>placeholder</b> attribute shows a hint inside the box.</p>
<p>The <b>type="password"</b> attribute obscures the text for security.</p>

</body>
</html>
