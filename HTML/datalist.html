<!DOCTYPE html>
<html>
<body>

<h2>Choose a Programming Language</h2>

<form>
  <input list="languages" name="language">

  <datalist id="languages">
    <option value="Java">
    <option value="Python">
    <option value="C">
    <option value="C++">
    <option value="JavaScript">
  </datalist>

  <input type="submit">
</form>

</body>
</html>
