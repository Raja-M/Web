<!DOCTYPE html>
<html>
<body>

<canvas id="myCanvas" width="250" height="120" style="border:1px solid black;"></canvas>

<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");
ctx.font = "30px Verdana";
ctx.fillStyle = "green";
ctx.fillText("Canvas Text",20,60);
</script>

</body>
</html>
